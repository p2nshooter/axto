name: CI

on:
  push:
    branches: [main, ccr-9ef9a045-gmv4m2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine (DNA, renderer, QA, lelang)
        working-directory: engine
        run: npm test
      - name: Engine QA dry-run (200 karya per koleksi)
        working-directory: engine
        env:
          DRY_RUN: '1'
        run: node bin/produce.mjs
      - name: Checkout vault (repo coinaxto)
        uses: actions/checkout@v4
        with:
          repository: p2nshooter/coinaxto
          path: vault-src
      - name: Kontrak + transaksi end-to-end (wallet → worker → vault → kontrak)
        run: |
          (cd worker && npm ci --no-audit --no-fund)
          (cd vault-src && npm ci --no-audit --no-fund)
          cd contracts && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund --no-save) && node scripts/compile.mjs
          VAULT_DIR="$GITHUB_WORKSPACE/vault-src" node --test test/*.test.mjs
      - name: Worker (kripto, bundel)
        working-directory: worker
        run: |
          npm test
          npx wrangler deploy --dry-run --outdir dist
      - name: AdSense axto.io (4 akun, 1 loader)
        working-directory: worker
        run: |
          node -e "
          import('./src/adsense.js').then(({ ADS_TXT, adsenseHead, ADSENSE_ACCOUNTS }) => {
            const fs = require('fs');
            const want = ['6560360898389273', '4906992051458194', '5928074389292014', '6701063918838796'];
            if (ADSENSE_ACCOUNTS.length !== 4 || !want.every((p) => ADSENSE_ACCOUNTS.includes('ca-pub-' + p))) throw new Error('akun AdSense harus tepat 4');
            if (fs.readFileSync('public/ads.txt', 'utf8') !== ADS_TXT) throw new Error('public/ads.txt berbeda dari adsense.js');
            if ((adsenseHead().match(/adsbygoogle.js/g) || []).length !== 1) throw new Error('harus tepat satu loader');
            console.log('AdSense OK');
          });"
