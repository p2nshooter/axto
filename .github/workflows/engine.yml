name: Engine produksi (24 jam)

# Tiap jam: lanjut dari checkpoint ledger axto.io → generate + QA → commit ber-HMAC. Gagal → tidak ada commit;
# run berikutnya melanjutkan dari titik yang sama. Tanpa R2 untuk koleksi publik (generatif).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      collections:
        description: 'Koleksi (koma), kosong = semua'
        required: false
      batch:
        description: 'Ukuran batch per koleksi'
        required: false
        default: '20000'

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Produksi + QA + commit
        working-directory: engine
        env:
          AXTO_API: https://axto.io
          ENGINE_HMAC_KEY: ${{ secrets.ENGINE_HMAC_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          COLLECTIONS: ${{ inputs.collections }}
          BATCH: ${{ inputs.batch || '20000' }}
        run: |
          # kunci HMAC sama dengan yang dipasang deploy.yml di worker (secret, atau turunan CLOUDFLARE_API_KEY)
          if [ -z "$ENGINE_HMAC_KEY" ] && [ -n "$CLOUDFLARE_API_KEY" ]; then
            export ENGINE_HMAC_KEY=$(printf '%s' "axto:ENGINE_HMAC_KEY" | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_KEY" | awk '{print $NF}')
          fi
          node bin/produce.mjs
