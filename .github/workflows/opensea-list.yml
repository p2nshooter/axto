name: Listing OpenSea otomatis (wallet toko)

# Desain akhir pemilik 23 Nov 2026: NFT publik dijual otomatis di OpenSea dengan HARGA TETAP (tanpa lelang), edisi 1-10
# per karya, harga $1-$10.000 menurut kelangkaan (engine/src/editions.js). Stok dibaca dari saldo on-chain wallet toko;
# karya habis keluar dari etalase axto.io; stok menipis -> rilis berikutnya otomatis. Hasil penjualan -> treasury (alamat
# dari R2 privat). Sebelum kontrak edisi aktif, skrip hanya menulis status „menunggu kontrak".
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Chain id (8453 = Base, 84532 = Base Sepolia)'
        required: false
        default: '8453'

concurrency:
  group: opensea-list
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang mesin listing
        working-directory: market
        run: npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund --no-save
      - name: Baca stok on-chain, rilis bila menipis, listing harga tetap, perbarui etalase, teruskan hasil ke treasury
        working-directory: market
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          CHAIN_ID: ${{ inputs.chain || '8453' }}
          BUDGET_MIN: '45'
        run: node opensea-list.mjs
