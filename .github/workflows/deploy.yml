name: Deploy axto.io

# Worker publik axto-web (axto.io). Rahasia hanya di GitHub Secrets / Cloudflare secrets, tidak pernah di repo.
# Penyimpanan: R2 axto-data (aturan pemilik: jangan pernah D1). KV axto-cache hanya cache pendek & rate limit.
# Vault (axto-vault) dideploy dari repo privat coinaxto lebih dulu — binding VAULT membutuhkannya.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'engine/src/**', '.github/workflows/deploy.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-axto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji engine & worker
        run: |
          (cd engine && npm test)
          (cd worker && npm ci && npm test)
      - name: R2 bucket & KV (idempoten)
        working-directory: worker
        run: |
          npx wrangler r2 bucket create axto-data 2>/dev/null || true
          id=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const n=JSON.parse(s).find(x=>x.title==='axto-cache');console.log(n?n.id:'')})")
          if [ -z "$id" ]; then npx wrangler kv namespace create axto-cache >/dev/null; id=$(npx wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).find(x=>x.title==='axto-cache').id))"); fi
          sed -i "s/REPLACE_WITH_KV_ID/$id/" wrangler.toml
      - name: Rahasia worker
        working-directory: worker
        run: |
          for k in SESSION_KEY DATA_KEY ENGINE_HMAC_KEY VAULT_HMAC_KEY; do
            v="${!k}"; [ -n "$v" ] && printf '%s' "$v" | npx wrangler secret put "$k" >/dev/null || echo "::warning::secret $k belum diisi"
          done
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          ENGINE_HMAC_KEY: ${{ secrets.ENGINE_HMAC_KEY }}
          VAULT_HMAC_KEY: ${{ secrets.VAULT_HMAC_KEY }}
      - name: Binding vault (lewati sementara bila axto-vault belum ada)
        working-directory: worker
        run: |
          if npx wrangler deployments list --name axto-vault >/dev/null 2>&1; then
            echo "axto-vault ada — binding VAULT aktif"
          else
            echo "::warning::axto-vault belum ter-deploy (repo coinaxto) — situs publik tetap jalan, fitur koin/klaim menunggu vault"
            python3 - <<'PY'
          import re
          p = 'wrangler.toml'
          s = open(p, encoding='utf8').read()
          s = re.sub(r'\n\[\[services\]\]\nbinding = "VAULT"\nservice = "axto-vault"\nentrypoint = "Vault"\n', '\n', s)
          open(p, 'w', encoding='utf8').write(s)
          PY
          fi
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
      - name: Cek live (AdSense 3 akun, ads.txt, halaman)
        run: |
          set -e
          sleep 10
          ads=$(curl -sf https://axto.io/ads.txt)
          for p in 6560360898389273 4906992051458194 5928074389292014; do
            echo "$ads" | grep -qx "google.com, pub-$p, DIRECT, f08c47fec0942fa0" || { echo "::error::ads.txt pub-$p hilang"; exit 1; }
          done
          [ "$(echo "$ads" | grep -c '^google.com')" = "3" ] || { echo "::error::ads.txt harus tepat 3 baris"; exit 1; }
          home=$(curl -sfL https://axto.io/en)
          for p in 6560360898389273 4906992051458194 5928074389292014; do
            echo "$home" | grep -q "name=\"google-adsense-account\" content=\"ca-pub-$p\"" || { echo "::error::meta ca-pub-$p hilang"; exit 1; }
          done
          [ "$(echo "$home" | grep -o 'adsbygoogle.js?client=' | wc -l)" = "1" ] || { echo "::error::harus tepat satu loader"; exit 1; }
          curl -sf https://axto.io/api/meta/time/1 | grep -q '"name"'
          echo "## axto.io live ✅ (AdSense 3 akun, loader ca-pub-5928074389292014)" >> "$GITHUB_STEP_SUMMARY"
