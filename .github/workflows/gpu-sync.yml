name: Seri G- (video GPU)

# Pemilik 24 Nov 2026: „Series G- wajib sudah dengan animasi saat produksi, jd 100% di buatkan GPU" · „G- berhenti" ·
# „Copy aja API GPU dari ulyah.com, biar ga terhubung ke ulyah.com". Lukisan seri G- dari worker axto.io (FLUX.2 + pemeriksa
# mutu); tiap jam (ops/gpu-sync.mjs) axto.io SENDIRI menjadikannya video lewat ZeroGPU dengan kunci di vault axto (salinan
# serah-terima tersegel dari ulyah.com), video ke R2 axto.io. Gagal dicoba lagi setelah 3 jam. Karya tampil hanya bila lolos
# mutu DAN sudah beranimasi.
# DIHENTIKAN 25 Nov 2026 (pemilik: „series G- produksi statik aja kaya di awal, ga usah ada animasi“): seri G- kini lukisan
# diam (worker/src/gpu.js). Workflow ini tidak lagi dijadwalkan; hanya bisa dijalankan manual.
on:
  workflow_dispatch:
  push:
    branches: [ccr-9ef9a045-gmv4m2, main]
    paths: ['ops/gpu-sync.mjs', '.github/workflows/gpu-sync.yml']

concurrency:
  group: gpu-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GPU_BUDGET_MIN: '40'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node --test ops/test/gpu-sync.test.mjs
        env:
          CLOUDFLARE_API_KEY: ''
      - name: Video GPU seri G- dirender axto.io → R2 axto.io
        run: node ops/gpu-sync.mjs
