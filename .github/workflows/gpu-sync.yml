name: Seri G- (video GPU)

# Pemilik 24 Nov 2026: „Series G- wajib sudah dengan animasi saat produksi, jd 100% di buatkan GPU" · „ini series G- sampah
# semua" · „bikin ulang semua". Lukisan seri G- kini hanya dari worker axto.io (FLUX.2 + pemeriksa mutu). Tiap jam
# (ops/gpu-sync.mjs): video buatan GPU (kunci GPU ulyah.com, ZeroGPU) disalin ke R2 axto.io, karya lolos mutu yang belum
# beranimasi diantrekan. Karya tampil hanya bila lolos mutu DAN sudah beranimasi.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [ccr-9ef9a045-gmv4m2, main]
    paths: ['ops/gpu-sync.mjs', '.github/workflows/gpu-sync.yml']

concurrency:
  group: gpu-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji
        run: node --test ops/test/gpu-sync.test.mjs
        env:
          CLOUDFLARE_API_KEY: ''
      - name: Video GPU → R2 axto.io, antrean video → ulyah.com (seri G-)
        run: node ops/gpu-sync.mjs
