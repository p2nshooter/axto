name: Penjaga produksi 24 jam

# Pemilik, 23 Nov 2026: „series G- berhenti produksi, kenapa ini" · „Pastikan produksi berjalan 24 jam non stop baik series
# G- maupun series yg lain" · „Tapi semuanya tetep gratis".
#
# Penyebab berhenti: jadwal cron GitHub Actions sering dilewati saat GitHub sibuk (gpu-sync tidak pernah sekali pun
# terpicu jadwal; engine & listing OpenSea hanya beberapa kali sehari). Penjaga ini hidup terus-menerus dan memicu setiap
# produksi tepat waktu lewat workflow_dispatch, lalu menyambung dirinya sendiri sebelum batas 6 jam per job — rantai
# workflow_dispatch dengan GITHUB_TOKEN memang diizinkan GitHub. Gratis: repo publik (menit runner standar tidak dihitung).
# Jadwal di bawah hanya cadangan untuk menghidupkan rantai bila putus.
on:
  workflow_dispatch:
  push:
    branches: [ccr-9ef9a045-gmv4m2, main]
    paths: ['.github/workflows/penjaga-produksi.yml']
  schedule:
    - cron: '13,43 * * * *'

concurrency:
  group: penjaga-produksi
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  jaga:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CABANG: ${{ github.event.repository.default_branch }}
    steps:
      - name: Jaga produksi (pembayaran, engine, seri G-, listing OpenSea, deploy kontrak, wallet gas) ±5 jam 40 menit
        run: |
          set -u
          # berkas workflow · jeda minimum antarputaran (menit)
          JADWAL="pay-sync.yml:10 engine.yml:60 gpu-sync.yml:60 opensea-list.yml:60 contracts-deploy.yml:10 gas-relay.yml:10"
          mulai=$(date +%s)
          picu() {
            local wf=$1 menit=$2 info status dibuat umur
            info=$(gh run list --workflow "$wf" --limit 1 --json status,createdAt --jq '.[0] | "\(.status) \(.createdAt)"' 2>/dev/null || echo "")
            status=${info%% *}
            dibuat=${info#* }
            case "$status" in queued|in_progress|waiting|pending|requested) return 0 ;; esac
            if [ -n "$info" ] && [ "$dibuat" != "$info" ]; then
              umur=$(( ( $(date +%s) - $(date -d "$dibuat" +%s) ) / 60 ))
              [ "$umur" -lt "$menit" ] && return 0
            fi
            if gh workflow run "$wf" --ref "$CABANG" >/dev/null 2>&1; then echo "$(date -u +%H:%M) ▶ $wf (putaran terakhir ${umur:-?} menit lalu)"; else echo "$(date -u +%H:%M) ✗ gagal memicu $wf"; fi
          }
          while [ $(( $(date +%s) - mulai )) -lt $(( 340 * 60 )) ]; do
            for x in $JADWAL; do picu "${x%%:*}" "${x##*:}"; done
            sleep 60
          done
      - name: Sambung rantai — penjaga berikutnya
        if: always()
        run: gh workflow run penjaga-produksi.yml --ref "$CABANG" && echo "penjaga berikutnya dipicu"
